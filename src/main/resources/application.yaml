spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rbac-mfa-starter-springboot
  datasource:
    url: jdbc:h2:mem:rbacdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Dev-only placeholder — override with a real secret via the JWT_SECRET env var before any real deployment.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-deploying-anywhere-real-01}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 min access token — short-lived by design, refresh token covers the rest
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
